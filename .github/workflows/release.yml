name: Automação de Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # O tipo de projeto (node, python, java, ruby, rust, ou "simple" para genéricos)
          release-type: simple